# CI override — stubs ALL non-testable services with busybox
# Core services tested for real: npm-db, litecart-db, nginx-proxy-manager

services:

  # ── Custom-build services → busybox stub ──────────────────────────────────
  control-panel:
    image: busybox
    command: ["tail", "-f", "/dev/null"]
    build: null
    volumes: []
    ports:
      - "8088:8088"
    environment:
      TZ: "UTC"
    depends_on: {}

  release-api:
    image: busybox
    command: ["tail", "-f", "/dev/null"]
    build: null
    volumes: []
    depends_on: {}

  litecart:
    image: busybox
    command: ["tail", "-f", "/dev/null"]
    build: null
    volumes: []
    depends_on: {}

  telemetry-api:
    image: busybox
    command: ["tail", "-f", "/dev/null"]
    build: null
    volumes: []
    depends_on: {}

  # ── Heavy / external-dependent services → busybox stub ────────────────────
  cloudflared:
    image: busybox
    command: ["tail", "-f", "/dev/null"]
    depends_on: {}

  crowdsec:
    image: busybox
    command: ["tail", "-f", "/dev/null"]
    volumes: []
    environment:
      TZ: "UTC"

  ollama:
    image: busybox
    command: ["tail", "-f", "/dev/null"]
    volumes: []
    environment:
      TZ: "UTC"

  cloakbrowser:
    image: busybox
    command: ["tail", "-f", "/dev/null"]
    environment:
      TZ: "UTC"

  n8n:
    image: busybox
    command: ["tail", "-f", "/dev/null"]
    volumes: []
    depends_on: {}
    environment:
      TZ: "UTC"
